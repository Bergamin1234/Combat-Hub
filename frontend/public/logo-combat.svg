<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dark & Metallic Gradients -->
    <linearGradient id="shieldBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E2024"/>
      <stop offset="50%" stop-color="#121316"/>
      <stop offset="100%" stop-color="#08090A"/>
    </linearGradient>

    <linearGradient id="metalRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="35%" stop-color="#94A3B8"/>
      <stop offset="70%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <linearGradient id="bladeGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>

    <linearGradient id="accentCore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Outer Protective Hexagonal Crest -->
  <polygon points="250,22 455,115 455,340 250,478 45,340 45,115" 
           fill="url(#shieldBg)" stroke="url(#metalRim)" stroke-width="8" stroke-linejoin="round" filter="url(#softGlow)"/>

  <!-- Inner Trim Outline -->
  <polygon points="250,45 430,128 430,325 250,448 70,325 70,128" 
           fill="#0F1013" stroke="#2B2D33" stroke-width="3" stroke-linejoin="round"/>

  <!-- Subtle Carbon Texture Stripes -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="2">
    <line x1="120" y1="120" x2="380" y2="380"/>
    <line x1="140" y1="100" x2="400" y2="360"/>
    <line x1="100" y1="140" x2="360" y2="400"/>
    <line x1="80" y1="160" x2="340" y2="420"/>
  </g>

  <!-- Central Martial Arts Emblem: Interlocking Striking Wings / Dual Katana Apex Crest -->
  <g filter="url(#softGlow)">
    <!-- Left Dynamic Wing / Blade -->
    <path d="M 250,110 L 160,195 L 205,255 L 250,215 L 225,185 L 250,160 Z" 
          fill="url(#bladeGradPrimary)"/>

    <!-- Right Dynamic Wing / Blade -->
    <path d="M 250,110 L 340,195 L 295,255 L 250,215 L 275,185 L 250,160 Z" 
          fill="url(#metalRim)"/>

    <!-- Center Apex Strike Spear -->
    <polygon points="250,90 270,155 250,180 230,155" 
             fill="#FFFFFF"/>

    <!-- Lower Shield Chevrons (Representing Ground Mastery & Striking Defense) -->
    <!-- Chevron 1 -->
    <path d="M 250,240 L 320,290 L 305,315 L 250,275 L 195,315 L 180,290 Z" 
          fill="url(#bladeGradPrimary)"/>

    <!-- Chevron 2 -->
    <path d="M 250,300 L 300,345 L 285,370 L 250,340 L 215,370 L 200,345 Z" 
          fill="url(#accentCore)"/>

    <!-- Apex Diamond Core -->
    <polygon points="250,360 268,390 250,420 232,390" 
             fill="#F8FAFC"/>
  </g>

  <!-- Stars of Excellence & Discipline -->
  <g fill="#F1F5F9" opacity="0.9">
    <!-- Center Star -->
    <polygon points="250,60 254,70 265,70 256,76 259,86 250,80 241,86 244,76 235,70 246,70"/>
    <!-- Left Star -->
    <polygon points="175,115 178,122 186,122 179,127 181,135 175,130 169,135 171,127 164,122 172,122"/>
    <!-- Right Star -->
    <polygon points="325,115 328,122 336,122 329,127 331,135 325,130 319,135 321,127 314,122 322,122"/>
  </g>
</svg>
