<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1A1E"/>
      <stop offset="50%" stop-color="#0E0E10"/>
      <stop offset="100%" stop-color="#070708"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="50%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#DC2626" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Circular Badge Outline -->
  <circle cx="250" cy="250" r="235" fill="url(#bgGrad)" stroke="#27272A" stroke-width="4"/>
  <circle cx="250" cy="250" r="222" fill="none" stroke="url(#redGrad)" stroke-width="6" filter="url(#shadow)"/>
  <circle cx="250" cy="250" r="210" fill="none" stroke="#27272A" stroke-dasharray="8 6" stroke-width="2"/>

  <!-- Shield Outline -->
  <path d="M 250,75 L 360,125 C 360,250 295,340 250,375 C 205,340 140,250 140,125 Z" 
        fill="#141416" stroke="url(#redGrad)" stroke-width="8" stroke-linejoin="round"/>

  <!-- Inner Shield Trim -->
  <path d="M 250,95 L 340,135 C 340,240 285,320 250,350 C 215,320 160,240 160,135 Z" 
        fill="#1A1A1E" stroke="#3F3F46" stroke-width="3"/>

  <!-- Stylized Combat Fist / Wings -->
  <g fill="url(#redGrad)">
    <!-- Center Strike Symbol -->
    <path d="M 250,130 L 275,200 L 250,225 L 225,200 Z"/>
    <!-- Wings / Blades -->
    <path d="M 250,185 L 305,215 L 285,255 L 250,230 Z"/>
    <path d="M 250,185 L 195,215 L 215,255 L 250,230 Z"/>
    <!-- Lower V -->
    <path d="M 250,245 L 290,275 L 250,330 L 210,275 Z"/>
  </g>

  <!-- Gold Star Emblems -->
  <g fill="url(#goldGrad)">
    <polygon points="250,135 254,147 267,147 256,155 260,167 250,160 240,167 244,155 233,147 246,147"/>
    <polygon points="190,170 193,179 203,179 195,185 198,194 190,189 182,194 185,185 177,179 187,179"/>
    <polygon points="310,170 313,179 323,179 315,185 318,194 310,189 302,194 305,185 297,179 307,179"/>
  </g>

  <!-- Banner for Typography -->
  <path d="M 100,395 L 400,395 L 380,445 L 120,445 Z" fill="#DC2626"/>
  <text x="250" y="432" font-family="'Montserrat', 'Arial Black', sans-serif" font-weight="900" font-size="34" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="6">COMBAT HUB</text>

  <!-- Upper Arch text -->
  <text x="250" y="55" font-family="'Montserrat', sans-serif" font-weight="800" font-size="14" 
        fill="#A1A1AA" text-anchor="middle" letter-spacing="8">CENTRO DE COMBATE</text>
</svg>
