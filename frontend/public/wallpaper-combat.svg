<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%">
  <defs>
    <style>
      @keyframes octagonPulse {
        0%, 100% {
          stroke-opacity: 0.12;
          transform: scale(1);
          transform-origin: 960px 540px;
        }
        50% {
          stroke-opacity: 0.28;
          transform: scale(1.03);
          transform-origin: 960px 540px;
        }
      }

      @keyframes slashDrift {
        0% {
          transform: translateX(-40px) translateY(-20px);
          opacity: 0.10;
        }
        50% {
          transform: translateX(30px) translateY(15px);
          opacity: 0.22;
        }
        100% {
          transform: translateX(-40px) translateY(-20px);
          opacity: 0.10;
        }
      }

      @keyframes gridBreathe {
        0%, 100% { opacity: 0.08; }
        50% { opacity: 0.16; }
      }

      @keyframes sparkFloat {
        0% { transform: translateY(0px) scale(0.8); opacity: 0.1; }
        50% { transform: translateY(-40px) scale(1.2); opacity: 0.35; }
        100% { transform: translateY(-80px) scale(0.9); opacity: 0.1; }
      }

      .pulse-octagon-1 {
        animation: octagonPulse 8s ease-in-out infinite;
      }
      .pulse-octagon-2 {
        animation: octagonPulse 12s ease-in-out infinite reverse;
      }
      .drift-slashes {
        animation: slashDrift 14s ease-in-out infinite;
      }
      .breathe-grid {
        animation: gridBreathe 10s ease-in-out infinite;
      }
      .spark-1 { animation: sparkFloat 6s ease-in-out infinite; }
      .spark-2 { animation: sparkFloat 8s ease-in-out infinite 2s; }
      .spark-3 { animation: sparkFloat 7s ease-in-out infinite 4s; }
    </style>

    <radialGradient id="arenaSpotlight" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.22"/>
      <stop offset="45%" stop-color="#991B1B" stop-opacity="0.08"/>
      <stop offset="85%" stop-color="#0B0B0C" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050506" stop-opacity="1"/>
    </radialGradient>

    <linearGradient id="neonSlash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444" stop-opacity="0.28"/>
      <stop offset="50%" stop-color="#DC2626" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#7F1D1D" stop-opacity="0.0"/>
    </linearGradient>

    <pattern id="cagePattern" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 30,0 L 60,30 L 30,60 L 0,30 Z" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- Fundo Escuro de Ginásio / Arena -->
  <rect width="1920" height="1080" fill="#0B0C0E"/>
  <rect width="1920" height="1080" fill="url(#arenaSpotlight)"/>

  <!-- Grade de Octógono / Cage Wire Mesh (Breathe animation) -->
  <rect width="1920" height="1080" fill="url(#cagePattern)" class="breathe-grid" />

  <!-- Linhas Marciais e Guias de Tatame -->
  <g stroke="#3F3F46" stroke-width="1.2" opacity="0.12" class="breathe-grid">
    <line x1="0" y1="270" x2="1920" y2="270" />
    <line x1="0" y1="540" x2="1920" y2="540" stroke-dasharray="16 10" />
    <line x1="0" y1="810" x2="1920" y2="810" />
    <line x1="480" y1="0" x2="480" y2="1080" />
    <line x1="960" y1="0" x2="960" y2="1080" stroke-dasharray="16 10" />
    <line x1="1440" y1="0" x2="1440" y2="1080" />
  </g>

  <!-- Faixas Diagonais de Combate / Slashes Dinâmicos -->
  <g class="drift-slashes">
    <path d="M -100,0 L 750,1080 L 830,1080 L -20,0 Z" fill="url(#neonSlash)"/>
    <path d="M 450,0 L 1320,1080 L 1380,1080 L 510,0 Z" fill="url(#neonSlash)"/>
    <path d="M 1150,0 L 1980,950 L 1980,1050 L 1070,0 Z" fill="url(#neonSlash)"/>
  </g>

  <!-- Octógono Central de Destaque (Silhueta Marcial) -->
  <g class="pulse-octagon-1">
    <polygon points="960,180 1340,360 1340,780 960,960 580,780 580,360" 
             fill="none" stroke="#DC2626" stroke-width="2.5" opacity="0.22"/>
  </g>
  <g class="pulse-octagon-2">
    <polygon points="960,240 1260,390 1260,730 960,880 660,730 660,390" 
             fill="none" stroke="#EF4444" stroke-width="1.8" stroke-dasharray="12 10" opacity="0.18"/>
  </g>

  <!-- Círculo de Centro de Tatame / Área de Luta -->
  <circle cx="960" cy="540" r="190" fill="none" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.14" class="pulse-octagon-1" />
  <circle cx="960" cy="540" r="70" fill="#DC2626" fill-opacity="0.08" class="pulse-octagon-2" />

  <!-- Partículas / Centelhas de Arena -->
  <circle cx="420" cy="460" r="3" fill="#EF4444" class="spark-1" />
  <circle cx="890" cy="310" r="2.5" fill="#F59E0B" class="spark-2" />
  <circle cx="1380" cy="620" r="3.5" fill="#EF4444" class="spark-3" />
  <circle cx="1520" cy="380" r="2" fill="#F87171" class="spark-1" />
  <circle cx="680" cy="790" r="3" fill="#EF4444" class="spark-2" />
</svg>
